<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E498" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C" />
      <stop offset="30%" stop-color="#EED58E" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF0B3" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A7B2C" />
      <stop offset="100%" stop-color="#5E4310" />
    </linearGradient>

    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="70%" stop-color="#141414" />
      <stop offset="100%" stop-color="#2A2210" />
    </radialGradient>

    <!-- Bevel & Emboss Filter -->
    <filter id="goldEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Matte Obsidian (optional container) -->
  <rect width="800" height="800" fill="#080808" rx="24" />

  <!-- Subtle Radial Ambient Light behind Logo -->
  <radialGradient id="bgGlow" cx="50%" cy="45%" r="45%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
    <stop offset="70%" stop-color="#080808" stop-opacity="0" />
  </radialGradient>
  <rect width="800" height="800" fill="url(#bgGlow)" />

  <g filter="url(#goldEmboss)" transform="translate(0, -10)">
    <!-- Camera Outline Behind Letter A -->
    <!-- Top viewfinder bump -->
    <path d="M 285 345 L 325 345 L 332 356 L 278 356 Z" fill="url(#goldLight)" />
    
    <!-- Camera body outer stroke -->
    <rect x="235" y="356" width="330" height="200" rx="20" ry="20" 
          fill="none" stroke="url(#goldMetallic)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stylized Monogram "A" -->
    <!-- Apex and Left Leg -->
    <path d="M 400 205 L 435 205 L 305 580 L 265 580 L 315 580 Z" fill="none" />
    <!-- Left Stalk with Serif -->
    <polygon points="380,215 410,215 285,580 250,580 250,570 282,570 375,225" fill="url(#goldLight)" />
    
    <!-- Right Leg of the A with Serif -->
    <polygon points="398,215 425,215 538,570 570,570 570,580 500,580 405,225" fill="url(#goldMetallic)" />
    
    <!-- Top Apex Cap of A -->
    <polygon points="378,215 403,165 428,215" fill="url(#goldLight)" />

    <!-- Aperture Base Ring -->
    <circle cx="400" cy="485" r="62" fill="url(#apertureGlow)" stroke="url(#goldMetallic)" stroke-width="5" />

    <!-- Aperture Blades (8-Blade Shutter Mechanism) -->
    <g transform="translate(400, 485)">
      <!-- Blade 1 -->
      <path d="M 0 -58 A 58 58 0 0 1 41 -41 L 18 -10 Z" fill="url(#goldMetallic)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 2 -->
      <path d="M 41 -41 A 58 58 0 0 1 58 0 L 10 18 Z" fill="url(#goldLight)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 3 -->
      <path d="M 58 0 A 58 58 0 0 1 41 41 L -10 18 Z" fill="url(#goldMetallic)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 4 -->
      <path d="M 41 41 A 58 58 0 0 1 0 58 L -18 10 Z" fill="url(#goldLight)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 5 -->
      <path d="M 0 58 A 58 58 0 0 1 -41 41 L -18 -10 Z" fill="url(#goldMetallic)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 6 -->
      <path d="M -41 41 A 58 58 0 0 1 -58 0 L -10 -18 Z" fill="url(#goldLight)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 7 -->
      <path d="M -58 0 A 58 58 0 0 1 -41 -41 L 10 -18 Z" fill="url(#goldMetallic)" stroke="#111" stroke-width="1.5" />
      <!-- Blade 8 -->
      <path d="M -41 -41 A 58 58 0 0 1 0 -58 L 18 -10 Z" fill="url(#goldLight)" stroke="#111" stroke-width="1.5" />
      <!-- Central Optical Shutter Core -->
      <circle cx="0" cy="0" r="16" fill="#050505" stroke="url(#goldMetallic)" stroke-width="2" />
    </g>

    <!-- The Sweeping Dynamic Arc (Iris / Blade Swoosh over the letter A) -->
    <path d="M 315 450 C 350 405, 460 395, 520 455 C 570 505, 625 535, 655 528 C 620 545, 555 525, 505 470 C 445 405, 360 415, 315 450 Z" 
          fill="url(#goldLight)" />

    <!-- AARTIC Wordmark Typography -->
    <text x="400" y="660" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="62" 
          font-weight="700" 
          letter-spacing="24" 
          fill="url(#goldLight)">
      AARTIC
    </text>

    <!-- Subtitle: — PHOTOGRAPHY — -->
    <!-- Left Divider Line -->
    <line x1="170" y1="708" x2="270" y2="708" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="square" />
    
    <text x="400" y="715" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="14" 
          fill="url(#goldMetallic)">
      PHOTOGRAPHY
    </text>
    
    <!-- Right Divider Line -->
    <line x1="530" y1="708" x2="630" y2="708" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="square" />
  </g>
</svg>
